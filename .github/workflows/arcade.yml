name: Gerar Arcade Contribution Graph

on:
  schedule:
    # Executa diariamente à meia-noite UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Gerar jogos arcade
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Gerar SVGs dos jogos
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

          # Jogos disponíveis:
          # pacman
          # galaga
          # breakout
          # puzzle-bobble
          # bomberman
          # minesweeper
          games: "pacman,galaga,breakout,puzzle-bobble,bomberman,minesweeper"

      - name: Publicar arquivos na branch output-games
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-games
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
