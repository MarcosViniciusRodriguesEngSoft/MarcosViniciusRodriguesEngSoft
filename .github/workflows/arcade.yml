name: Gerar jogos arcade de contribuições

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gerar SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Opções: pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper
          games: "pacman,galaga,breakout"

      # Branch separada para não apagar os arquivos da cobrinha (branch output)
      - name: Publicar na branch output-games
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-games
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
