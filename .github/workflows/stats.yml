name: Gerar cards de estatísticas

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # PROFILE_TOKEN (opcional) é um token pessoal com escopo read:user e repo;
      # sem ele, os cards só enxergam repositórios públicos.
      STATS_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&include_all_commits=true&count_private=true
          path: dist/stats.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=7&theme=dark
          path: dist/top-langs.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Publicar na branch output-stats
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
