name: Gerar métricas do perfil

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gerar SVG de métricas
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, repositories
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          config_display: large
          config_timezone: America/Sao_Paulo
          committer_branch: ignore
          output_action: none
          filename: metrics.svg

      - name: Publicar na branch output-metrics
        run: |
          mkdir -p dist && cp /metrics_renders/metrics.svg dist/
          cd dist
          git init -q -b output-metrics
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A && git commit -q -m "Atualiza métricas"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output-metrics
