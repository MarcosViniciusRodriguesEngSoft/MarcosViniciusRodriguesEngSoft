name: Gerar troféus do GitHub

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Card de troféus
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c # master em 2026-10-28
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/trophy.svg
          token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          theme: darkhub

      - name: Publicar na branch output-stats
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
