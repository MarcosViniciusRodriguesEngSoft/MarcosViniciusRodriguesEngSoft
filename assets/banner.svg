  <rect width="1200" height="260" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="17.5" fill="none" stroke="#14e3c8" stroke-opacity="0.25"/>

  <text x="70" y="84" font-family="Consolas, 'Courier New', monospace" font-size="20" letter-spacing="3" fill="#14e3c8">OLÁ, EU SOU</text>
  <text x="68" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff">Marcos Vinicius Rodrigues</text>
  <rect x="70" y="180" width="320" height="3" rx="1.5" fill="url(#line)"/>
  <text x="70" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500" fill="#9fb4bd">Engenheiro de Software Full Stack</text>
