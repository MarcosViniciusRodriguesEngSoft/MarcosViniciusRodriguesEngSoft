<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Marcos Vinicius Rodrigues, Engenheiro de Software Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090d"/>
      <stop offset="1" stop-color="#0a1a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#14e3c8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14e3c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14e3c8"/>
      <stop offset="1" stop-color="#14e3c8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14e3c8" stroke-opacity="0.06"/>
